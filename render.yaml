services:
  - type: web
    name: mindscope-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/prepare_dataset.py
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port "$PORT" --workers 1 --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: CORS_ORIGINS
        value: "https://mind-scope-tau.vercel.app"
